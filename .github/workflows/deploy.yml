name: Deploy to Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4

      # 新增步骤：在云端打包时，用环境变量替换掉 wrangler.toml 里的占位符
      - name: Inject real D1 Database ID
        run: sed -i 's/xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx/${{ secrets.CF_D1_ID }}/g' wrangler.toml

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
